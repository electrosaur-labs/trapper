 * user guide available at https://docs.gradle.org/4.4.1/userguide/tutorial_java_projects.html
 */

// Apply the java plugin to add support for Java
apply plugin: 'java'

// Apply the application plugin to add support for building an application
apply plugin: 'application'

// In this section you declare where to find the dependencies of your project
repositories {
    // Use Maven Central for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

dependencies {
    // This dependency is found on compile classpath of this component and consumers.
    implementation 'com.google.guava:guava:32.1.3-jre'

    // TwelveMonkeys ImageIO for enhanced TIFF support
    implementation 'com.twelvemonkeys.imageio:imageio-tiff:3.11.0'
    implementation 'com.twelvemonkeys.imageio:imageio-core:3.11.0'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.13.2'
}

// Define the main class for the application
mainClassName = 'org.electrosaur.trapper.App'

