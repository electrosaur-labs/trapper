// Apply the java plugin to add support for Java
apply plugin: 'java'

// Apply the application plugin to add support for building an application
apply plugin: 'application'

// In this section you declare where to find the dependencies of your project
repositories {
    // Use Maven Central for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

dependencies {
    // This dependency is found on compile classpath of this component and consumers.
    implementation 'com.google.guava:guava:32.1.3-jre'

    // TwelveMonkeys ImageIO for enhanced TIFF and PSD support
    implementation 'com.twelvemonkeys.imageio:imageio-tiff:3.11.0'
    implementation 'com.twelvemonkeys.imageio:imageio-psd:3.11.0'
    implementation 'com.twelvemonkeys.imageio:imageio-core:3.11.0'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.13.2'
}

// Define the main class for the application
mainClassName = 'org.electrosaur.trapper.App'

// Task to run PsdColorSeparator
task runColorSeparator(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.electrosaur.trapper.PsdColorSeparator'
    if (project.hasProperty('psdFile')) {
        args project.property('psdFile')

        // Optional parameters: minTrap, maxTrap, mode
        if (project.hasProperty('minTrap')) {
            args project.property('minTrap')
        }
        if (project.hasProperty('maxTrap')) {
            args project.property('maxTrap')
        }
        if (project.hasProperty('mode')) {
            args project.property('mode')
        }
    }
}

// Task to run TestFileGenerator
task generateTestFile(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.electrosaur.trapper.TestFileGenerator'
    if (project.hasProperty('testName')) {
        args project.property('testName')
    }
    if (project.hasProperty('width') && project.hasProperty('height')) {
        args project.property('width'), project.property('height')
    }
}

